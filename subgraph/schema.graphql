"""
Discovery and verified-delivery reputation (BUILD-PLAN P2-B).

Design note: `verifiedDeliveries` is NOT a user input — only the `JobVerified` event emitted by
Verifier.sol can increment it. So reputation is tied to paid, verified jobs.
(CLAUDE.md §11 boundary: this is not "Sybil-proof"; inflating it is EXPENSIVE, not impossible.)

The single deviation from the plan: `Agent.id` is a String, not Bytes (the decimal agentId).
Why: agentId is a uint256 and the endianness of a BigInt→Bytes conversion in AssemblyScript is
open to silent error. A decimal string is both unambiguous and readable in queries:
agent(id: "8429"). `Job.id` is naturally bytes32 so it stayed Bytes.
"""
type Agent @entity(immutable: false) {
  "ERC-8004 agentId (the NFT token id), as a decimal string."
  id: String!
  owner: Bytes!
  "The URI supplied at registration (may point at the agent card)."
  agentURI: String
  "From the on-chain `skill` metadata. Decision (a): metadata lives on chain — see DECISION.md."
  skills: [String!]!
  endpoint: String
  eciesPubKey: String
  "ERC-5564 stealth meta-address (P4-B)."
  stealthMetaAddress: String
  registeredAt: BigInt!
  registeredBlock: BigInt!
  "When the registration/metadata was last updated."
  updatedAt: BigInt!

  "The Verifier.sol `JobVerified` counter — it starts filling once P3-A is deployed."
  verifiedDeliveries: Int!
  "The `JobRejected` counter — the fraud path is indexed too (the demo shows this)."
  rejectedAttempts: Int!

  jobs: [Job!]! @derivedFrom(field: "agent")
  metadata: [AgentMetadata!]! @derivedFrom(field: "agent")
}

"""
Raw key/value metadata. A separate entity, because the registry permits arbitrary keys; we want
to index everything without losing the keys beyond the four we fixed in the schema.
"""
type AgentMetadata @entity(immutable: false) {
  "<agentId>-<key>"
  id: String!
  agent: Agent!
  key: String!
  value: String!
  updatedAt: BigInt!
}

type Job @entity(immutable: false) {
  "intentHash"
  id: Bytes!
  agent: Agent!
  client: Bytes!
  outputHash: Bytes
  "VERIFIED | REJECTED"
  status: String!
  "For REJECTED only: MatchFalse | BadEnclaveSig | BadClientSig | Expired | AlreadyVerified"
  rejectionCode: String
  price: BigInt!
  timestamp: BigInt!
  block: BigInt!
  txHash: Bytes!
}

"Single-row global counters — for the demo dApp's top strip."
type Registry @entity(immutable: false) {
  id: String!
  agentCount: Int!
  verifiedJobs: Int!
  rejectedJobs: Int!
}
