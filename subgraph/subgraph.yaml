specVersion: 1.0.0
description: >
  Confidential Agents — ERC-8004 kimlik keşfi + doğrulanmış teslimat sayacı.
  Kararlar ve bağlayıcı bulgular: subgraph/DECISION.md (pnpm gate:P0-F üretir).
repository: https://github.com/Zireaelst/ETHGlobal-Lisbon
schema:
  file: ./schema.graphql

dataSources:
  # ERC-8004 IdentityRegistry — Base Sepolia'daki CANLI referans deployment.
  # Adres bir UUPS proxy'dir; proxy adresini indeksliyoruz, implementasyon
  # yükseltilse de sabit kalır (DECISION.md).
  - kind: ethereum/contract
    name: IdentityRegistry
    network: base-sepolia
    source:
      address: "0x8004A818BFB912233c491871b3d84c89A494BD9e"
      abi: IdentityRegistry
      # P0-F'te not edilen kayıt bloğu. Daha ileri bir blok seçmek subgraph'ı
      # BOŞ indeksletir — plan bunu ayrıca uyarıyor.
      startBlock: 44584172
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/identity.ts
      entities:
        - Agent
        - AgentMetadata
        - Registry
      abis:
        - name: IdentityRegistry
          file: ./abis/IdentityRegistry.json
      eventHandlers:
        - event: Registered(indexed uint256,string,indexed address)
          handler: handleRegistered
        # Metadata BURADAN geliyor; sadece Registered indekslemek skill/endpoint'siz
        # agent üretir. `keyHash` indexed string olduğu için topic'te anahtarın HASH'i
        # durur — mapping non-indexed `key` alanını okur (DECISION.md tuzağı).
        - event: MetadataSet(indexed uint256,indexed string,string,bytes)
          handler: handleMetadataSet
        - event: URIUpdated(indexed uint256,string,indexed address)
          handler: handleURIUpdated
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
